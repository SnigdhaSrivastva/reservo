# Database Configuration
db.use_h2=true
db.url=jdbc:h2:mem:reservo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
db.user=sa
db.password=

# PostgreSQL Configuration (when use_h2=false)
# db.url=jdbc:postgresql://localhost:5432/reservo
# db.user=postgres
# db.password=postgres

# Server Configuration
server.port=8080
server.host=localhost

# Hold Configuration
hold.duration_seconds=300
hold.cleanup_interval_seconds=30

# Waitlist Configuration
waitlist.promotion_interval_seconds=10

# Connection Pool
db.pool.size=10
db.pool.max_size=20

# Isolation Level (READ_COMMITTED, REPEATABLE_READ, SERIALIZABLE)
db.isolation.level=READ_COMMITTED

